server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Same job as the proxy in vite.config.js: the page calls /api on its own origin.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10m;   # matches the backend's JSON limit (pasted birth messages)
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
